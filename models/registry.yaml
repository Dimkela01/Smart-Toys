tts:
  - id: kokoro-82m
    runtime: kokoro
    language: en
    license: apache-2.0
    internal_only: false
    source:
      repo: hexgrad/Kokoro-82M
      files:
        config.json: 5abb01e2403b072bf03d04fde160443e209d7a0dad49a423be15196b9b43c17f
        kokoro-v1_0.pth: 496dba118d1a58f5f3db2efc88dbdc216e0483fc89fe6e47ee1f2c53f18ad1e4
        # one female and one male US voice; the other 52 are not downloaded
        voices/af_heart.pt: 0ab5709b8ffab19bfd849cd11d98f75b60af7733253ad0d67b12382a102cb4ff
        voices/am_michael.pt: 9a443b79a4b22489a5b0ab7c651a0bcd1a30bef675c28333f06971abbd47bd37
  - id: piper-sr-placeholder
    runtime: piper
    language: sr
    # Checked 2026-11-25: the only sr voice in piper-voices, and unusable for the product.
    #
    # Licence: its dataset (https://github.com/marytts/serbski-institut-dsb-data) is
    # CC BY-NC-SA 4.0, as its own MODEL_CARD states, so this voice may never be used
    # commercially - not "until confirmed" (docs/CLAUDE.md §3) but at all. Keep it
    # internal_only and off any public URL.
    #
    # Quality: a native Serbian speaker judged the samples - the speech is Serbian, but
    # the pronunciation is bad. That matches how it was built: the text -> phoneme stage
    # is eSpeak NG's Serbian (onnx.json: espeak.voice = sr), which is why it reads as
    # Serbian, while the phoneme -> audio stage was trained on the Sorbian Institute's
    # `dsb` recordings and finetuned from a U.S. English voice, which is where the
    # accent and prosody come from.
    #
    # A Serbian voice we own is an open question; see docs/reports/M2.md.
    license: cc-by-nc-sa-4.0
    internal_only: true
    source:
      repo: rhasspy/piper-voices
      files:
        sr/sr_RS/serbski_institut/medium/sr_RS-serbski_institut-medium.onnx: d7003890cf596e653f660a4fd97fd17f57f1eceb6d9727abad9cd76d2fda0d80
