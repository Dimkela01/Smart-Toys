# Model registry (F-20, ARCHITECTURE.md §8, docs/CLAUDE.md §3).
#
# This file is the ONLY place a model is named. No model id, file name or endpoint is
# hard-coded anywhere in the application code. The final choice comes from the benchmark
# in docs/EVALUATION.md; `default` below is only the starting point for M2.
#
# Weights are never committed. `make models` downloads them into models/weights/ and
# verifies sha256 (scripts/download_models.py). The digests below were recorded on first
# download, 2026-11-25, and are checked on every run; `null` means "not yet verified".
# `files:` may be a list of paths or, once recorded, a mapping of path -> sha256.
version: 1
default: qwen3-1.7b

models:
  - id: qwen3-1.7b
    family: qwen3
    file: Qwen3-1.7B-Q4_K_M.gguf
    quant: Q4_K_M
    size_mb: 1120
    context: 2048
    runtime: llama.cpp
    license: apache-2.0
    source:
      # Qwen's own GGUF repo publishes Q8_0 only; this is the documented Q4_K_M
      # (docs/CLAUDE.md §3), re-quantized by unsloth under the same apache-2.0.
      repo: unsloth/Qwen3-1.7B-GGUF
      path: Qwen3-1.7B-Q4_K_M.gguf
      sha256: b139949c5bd74937ad8ed8c8cf3d9ffb1e99c866c823204dc42c0d91fa181897
    options:
      # Qwen3 thinking must stay off; <think> is stripped defensively (ARCHITECTURE.md §6.3)
      enable_thinking: false
    endpoints:
      server: ${LLM_SERVER_URL}/v1
      device: ${DEVICE_TUNNEL_URL}/v1
    active_envs: [demo, pilot, eval]

  - id: gemma3-1b
    family: gemma3
    file: gemma-3-1b-it-q4_0.gguf
    # the QAT release is q4_0; there is no Q4_K_M in Google's own repo
    quant: Q4_0
    size_mb: 806
    context: 2048
    runtime: llama.cpp
    license: gemma-terms-of-use
    source:
      repo: google/gemma-3-1b-it-qat-q4_0-gguf
      path: gemma-3-1b-it-q4_0.gguf
      sha256: null
      # Google gates this repo: accept the terms on the model page and export
      # HF_TOKEN before `make models`. Only used by the benchmark (active_envs: eval).
      gated: true
    options: {}
    endpoints:
      server: ${LLM_SERVER_URL}/v1
      device: ${DEVICE_TUNNEL_URL}/v1
    active_envs: [eval]

  - id: qwen3-0.6b
    family: qwen3
    file: Qwen3-0.6B-Q4_K_M.gguf
    quant: Q4_K_M
    size_mb: 484
    context: 2048
    runtime: llama.cpp
    license: apache-2.0
    source:
      repo: unsloth/Qwen3-0.6B-GGUF
      path: Qwen3-0.6B-Q4_K_M.gguf
      sha256: ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a
    options:
      enable_thinking: false
    endpoints:
      server: ${LLM_SERVER_URL}/v1
      device: ${DEVICE_TUNNEL_URL}/v1
    active_envs: [eval]

# Speech models (used from M2; listed here so `make models` fetches everything at once).
stt:
