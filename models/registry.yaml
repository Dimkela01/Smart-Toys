        sr/sr_RS/serbski_institut/medium/MODEL_CARD: 1ed2209d4d01b359416f17772c6c11272bdb59359d0b0b076e31a5ccb87446ac
        sr/sr_RS/serbski_institut/medium/samples/speaker_0.mp3: ff36e3931e2747436eb490bcd4948697d4c0742e80c3ee63ce033262ae2f9764
        sr/sr_RS/serbski_institut/medium/samples/speaker_1.mp3: 5570deca2bde938f386133639c1873a6b79cd5419e7cc3ab1de790d7b93eca4a
