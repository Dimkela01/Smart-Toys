[project]
name = "bruno-api"
version = "0.1.0"
description = "Bruno MVP backend (FastAPI): auth, REST, child mode, admin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "argon2-cffi>=23.1.0",
    # encrypts the admin TOTP secret at rest (admins.totp_secret_enc)
    "cryptography>=44.0.0",
    "pyjwt>=2.9.0",
    "pyotp>=2.9.0",
    "redis>=5.2.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "RUF001", # the spec and the Serbian copy legitimately use en dashes and diacritics
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Alembic migration scripts are generated and not worth typing strictly
exclude = ["^app/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
